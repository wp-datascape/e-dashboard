# Deploy target dev: VPS aaPanel, sama pola dengan docker-compose.prod.yml (lihat
# docs-v2/task/task019.md) — port dan nama container beda supaya bisa jalan berdampingan
# dengan environment prod di server yang sama.

services:
  postgres:
    image: postgres:15-alpine
    container_name: e-dashboard-dev-db
    restart: unless-stopped
    # Tuning performa (audit 2026-08-20) — jatah lebih kecil dari prod (lihat
    # docker-compose.prod.yml) karena VPS 8GB dibagi bareng OS/aaPanel/mail
    # server/Postgres prod sekaligus, dev bukan prioritas RAM.
    command: >
      postgres
      -c shared_buffers=${PG_SHARED_BUFFERS:-384MB}
      -c work_mem=${PG_WORK_MEM:-16MB}
      -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM:-128MB}
      -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE:-768MB}
      -c jit=${PG_JIT:-off}
    environment:
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: e_dashboard
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dashboard']
      interval: 10s
      timeout: 5s
      retries: 5
    # Port publish backend (3002->3000) DITARUH DI SINI, bukan di service backend —
    # backend pakai network_mode: service:postgres di bawah (berbagi network namespace
    # supaya backend/src/config/db.ts anggap Postgres sebagai "localhost", lolos cek
    # SSL-detection yang cuma kenal localhost/127.0.0.1, tanpa ubah kode sama sekali).
    # Docker melarang `ports:` dipakai bareng `network_mode: service:x` di container
    # yang SAMA — jadi harus di container yang di-share (postgres), meski port yang
    # dipublish itu sebenarnya milik backend.
    ports:
      - '127.0.0.1:3002:3000'
      # Postgres publish ke 127.0.0.1 saja (bukan publik) — buat akses admin manual
      # via SSH tunnel (Navicat/psql dari lokal), lihat docs-v2/task/task019.md.
      - '127.0.0.1:5433:5432'

  backend:
    image: ghcr.io/wp-datascape/e-dashboard-backend:dev
    container_name: e-dashboard-dev-backend
    restart: unless-stopped
    network_mode: 'service:postgres'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://dashboard:${DB_PASSWORD}@localhost:5432/e_dashboard
      JWT_SECRET: ${JWT_SECRET}
      CSRF_SECRET: ${CSRF_SECRET}
      CREDENTIALS_ENCRYPTION_KEY: ${CREDENTIALS_ENCRYPTION_KEY}
      CORS_ORIGIN: https://dev-dashboard.semanggi.id
    # Image final (oven/bun:1) tidak punya curl/wget, jadi pakai bun -e (fetch bawaan
    # runtime) sebagai HTTP client-nya. Endpoint /health juga cek koneksi DB, bukan
    # cuma "proses belum mati" (INFRA-3).
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    image: ghcr.io/wp-datascape/e-dashboard-frontend:dev
    container_name: e-dashboard-dev-frontend
    restart: unless-stopped
    ports:
      - '127.0.0.1:8082:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  postgres_data_dev:
