<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1+user-scalable=no matikan pinch-zoom - permintaan eksplisit user
         supaya PWA terkesan native (2026-08-03), SADAR ini trade-off aksesibilitas
         (WCAG 1.4.4/1.4.10 biasanya minta zoom tetap bisa dipakai low-vision user).
         Sengaja TIDAK dimatikan di iterasi awal fix native-feel karena alasan itu -
         baru dimatikan sekarang setelah user dikasih tahu trade-off-nya & tetap minta. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- App Info -->
    <title>Executive Dashboard</title>
    <meta name="description" content="Business stats dashboard for holding company" />
    <meta name="application-name" content="Executive Dashboard" />

    <!-- PWA Manifest — di-generate & di-inject otomatis oleh vite-plugin-pwa saat build -->

    <!-- Theme Color (also used for PWA title bar) -->
    <meta name="theme-color" content="#863bff" />
    <meta name="msapplication-TileColor" content="#863bff" />

    <!-- iOS PWA — Safari abaikan manifest.icons, wajib pakai apple-touch-icon (PNG, bukan SVG) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="E-Dashboard" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
