      tags: [Settings — High Margin]
      summary: Tambah mapping High Margin baru
      description: >
        `created_by` diambil dari header `x-user-id` (default 1) di backend,
        BUKAN dari session JWT yang sedang login — pola berbeda dari fitur
        lain di sistem ini, dicatat apa adanya untuk transparansi audit trail.
      security: [{ cookieAuth: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateHighMarginRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HighMarginMappingResponse' }
