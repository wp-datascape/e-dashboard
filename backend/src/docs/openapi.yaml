paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      description: >
        Endpoint publik (tidak butuh auth). Berhasil login akan set 3 cookie
        (access_token, refresh_token, csrf_token) — dipakai otomatis oleh
        Swagger UI ini untuk request selanjutnya di halaman yang sama.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoginResponse' }
        '401':
          description: Email/password salah
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '429':
          description: Rate limited (10x/15 menit per IP)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      description: Hapus 3 cookie auth. Butuh CSRF header (mutasi).
      security: [{ cookieAuth: [], csrfHeader: [] }]
      responses:
        '200':
          description: Logout berhasil
        '401':
          description: Belum login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token
      description: Pakai refresh_token cookie, tidak butuh CSRF header.
      security: []
      responses:
        '200':
          description: Token diperbarui
        '401':
          description: Refresh token tidak ada/invalid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /auth/me:
    get:
      tags: [Auth]
      summary: Data user yang sedang login
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeResponse' }
        '401':
          description: Belum login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /dashboard:
    get:
      tags: [Dashboard]
      summary: Ringkasan 10 KPI (M1-M10)
      description: >
        Agregator — selalu company scope 'all', tanggal referensi hari ini.
        Tidak ada query params.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401':
          description: Belum login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /metrics/cross-selling:
    get:
      tags: [Metrics]
      summary: Cross Selling Ratio (M1) & Avg Category (M2)
      description: Trend 12 bulan cross-selling ratio dan rata-rata kategori produk per customer aktif.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: company_id
          in: query
          schema:
            oneOf:
              - { type: integer, minimum: 1 }
              - { type: string, enum: [all] }
            default: all
          description: ID company, atau "all" untuk semua company (holding view)
        - name: period_end
          in: query
          schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
          example: "2026-07-31"
          description: Format YYYY-MM-DD, default akhir bulan berjalan
        - name: division
          in: query
          schema:
            type: string
            enum: [distribution, project, e_commerce, intercompany, freelancer, support]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CrossSellingResponse' }
        '400':
          description: Query tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Belum login
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Users ────────────────────────────────────────────────────────────────
  /users:
    get:
      tags: [Users]
      summary: List users
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PerPageParam'
        - name: sort
          in: query
          schema: { type: string, pattern: '^[a-z_]+:(asc|desc)$' }
          example: "created_at:desc"
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Users]
      summary: Buat user baru
      security: [{ cookieAuth: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Email sudah terdaftar
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Detail user
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPathParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Users]
      summary: Update user (profil, status, roles, companies)
      security: [{ cookieAuth: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPathParam' }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
