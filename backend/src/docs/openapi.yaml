        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Settings — High Margin]
      summary: Hapus mapping
      description: "Response 200 dengan { id } di body — BUKAN 204, beda dari kebanyakan delete lain di API ini."
      security: [{ cookieAuth: [], csrfHeader: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPathParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      id: { type: integer }
