        - name: key
          in: path
          required: true
          schema: { type: string }
          example: "dormant_threshold_months.b2b_dc"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBusinessConfigRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
