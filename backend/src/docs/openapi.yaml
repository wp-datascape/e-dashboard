          in: query
          schema: { type: integer, minimum: 1, maximum: 24 }
          description: "Tidak ada default hardcode di endpoint ini — beda dari endpoint metrics lain, nilainya dari business_config kalau tidak dikirim."
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProductTrendResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ─── Transactions (Order Ledger / invoices) ─────────────────────────────
  /invoices:
    get:
      tags: [Transactions]
      summary: List faktur (Order Ledger)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - $ref: '#/components/parameters/DivisionParam'
        - name: customer_search
          in: query
          schema: { type: string }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: sort_by
          in: query
          schema: { type: string, enum: [invoice_date, total_revenue, total_gp], default: invoice_date }
        - name: sort_dir
          in: query
          schema: { type: string, enum: [asc, desc], default: desc }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /invoices/{id}:
    get:
      tags: [Transactions]
      summary: Detail faktur + item baris
      description: >
        Scope company di-resolve ke 'all' di level query lalu diverifikasi
        row-level di dalam service — bukan difilter di WHERE clause company_id
        seperti kebanyakan endpoint lain.
      security: [{ cookieAuth: [] }]
      parameters: [{ $ref: '#/components/parameters/IdPathParam' }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceDetailResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
