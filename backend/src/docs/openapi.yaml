openapi: 3.1.0
info:
  title: Executive Dashboard API
  version: "1.0.0"
  description: >
    Internal API — holding company executive dashboard.
    Spec ini ditulis manual (bukan auto-generate). Cakupan: seluruh endpoint
    protected (di bawah protectedApi di router.ts) kecuali endpoint proxy
    live ke Accurate Online (GET /products/accurate, /products/accurate/categories)
    dan endpoint upload/download biner (didokumentasikan bentuknya, bukan
    "try it out" penuh karena Swagger UI kurang nyaman untuk file besar).
servers:
  - url: /api/v1
    description: Current server

tags:
  - name: Auth
  - name: Dashboard
  - name: Metrics
  - name: Users
  - name: Page Settings
  - name: Companies
  - name: Roles
  - name: Permissions
  - name: Config
  - name: Audit Log
  - name: Customers
  - name: Products
  - name: Import
  - name: Classification Rules
  - name: Settings — High Margin
  - name: Settings — Channel Divisions
  - name: Transactions

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: >
        JWT httpOnly cookie, didapat dari response POST /auth/login.
        Browser mengirimnya otomatis pada request berikutnya ke origin yang sama.
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: >
        Wajib untuk request mutasi (POST/PUT/PATCH/DELETE).
        Nilainya dari cookie csrf_token (di-set saat login), Swagger UI di halaman ini
        otomatis membaca & mengisi header ini lewat requestInterceptor.

  parameters:
    CompanyIdParam:
      name: company_id
      in: query
      schema:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, enum: [all] }
        default: all
      description: ID company, atau "all" untuk semua company (holding view)
    CompanyIdRequiredParam:
      name: company_id
      in: query
      required: true
      schema: { type: integer, minimum: 1 }
      description: ID company — wajib diisi (tidak ada opsi "all" di endpoint ini)
    DivisionParam:
      name: division
      in: query
      schema:
        type: string
        enum: [distribution, project, e_commerce, intercompany, freelancer, support]
    PeriodMonthParam:
      name: period_month
      in: query
      schema: { type: string, pattern: '^\d{4}-\d{2}$' }
      example: "2026-07"
      description: Format YYYY-MM, default bulan berjalan
    PeriodEndParam:
      name: period_end
      in: query
      schema: { type: string, format: date, pattern: '^\d{4}-\d{2}-\d{2}$' }
      example: "2026-07-31"
      description: Format YYYY-MM-DD, default akhir bulan berjalan
    ActiveWindowParam:
      name: active_window
      in: query
      schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      description: Rentang lookback dalam bulan
    PageParam:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PerPageParam:
      name: per_page
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    IdPathParam:
      name: id
      in: path
      required: true
      schema: { type: integer, minimum: 1 }

  responses:
    Unauthorized:
      description: Belum login / cookie access_token tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    ValidationError:
      description: Query/body tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErrorResponse' }

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: admin@mail.com
        password:
          type: string
          format: password
          example: "123456"

    LoginResponse:
      type: object
      properties:
        message:
          type: string
          example: Login berhasil
        data:
          type: object
          properties:
            csrf_token:
              type: string
            data:
              type: object
              properties:
                token:
                  type: string
                user:
                  type: object
                  properties:
                    id: { type: string }
                    name: { type: string }
                    email: { type: string }
                    role: { type: string }
                permissions:
                  type: array
                  items: { type: string }

    MeResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            email: { type: string }
            role: { type: string }

    MonthlyTrendPoint:
      type: object
      properties:
        month: { type: string, example: "2026-07" }
        value: { type: number }

    MetricCard:
      type: object
      properties:
        metric_key: { type: string, example: cross_selling_ratio }
        title: { type: string }
        subtitle: { type: string }
        link: { type: string }
        format: { type: string, enum: [percent, number, currency] }
        color: { type: string, example: "#3B82F6" }
        summary:
          type: object
          properties:
            current_value: { type: number }
            previous_value: { type: number }
            change_percent: { type: number }
            trend: { type: string, enum: [up, down, stable] }
        monthly_trend:
          type: array
          items: { $ref: '#/components/schemas/MonthlyTrendPoint' }

    DashboardResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            period_month: { type: string, example: "2026-07" }
            active_window: { type: integer, example: 1 }
            metrics:
              type: array
              items: { $ref: '#/components/schemas/MetricCard' }

    CrossSellingResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            period:
              type: object
              properties:
                start: { type: string, format: date }
                end: { type: string, format: date }
                active_months: { type: integer }
            kpi1:
              type: object
              properties:
                multi_cat_count: { type: integer }
                active_count: { type: integer }
                rate: { type: number }
            kpi2:
              type: object
              properties:
                avg_categories: { type: number }
                total_distinct_cats: { type: integer }
            trend:
              type: array
              items:
                type: object
                properties:
                  month: { type: string }
                  total_active: { type: integer }
                  multi_product: { type: integer }
                  ratio: { type: number }
                  avg_category: { type: number }

    PaginationMeta:
      type: object
      properties:
        page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        total_pages: { type: integer }

    # ─── Users ──────────────────────────────────────────────────────────────
    RoleRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        is_system: { type: boolean }
    CompanyRef:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleRef' }
        companies:
          type: array
          items: { $ref: '#/components/schemas/CompanyRef' }
    UserListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    UserResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/User' }
    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        email: { type: string, format: email }
        password: { type: string, minLength: 8, maxLength: 72 }
    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 255 }
        is_active: { type: boolean }
        role_ids:
          type: array
          items: { type: integer }
        company_ids:
          type: array
          items: { type: integer }

    # ─── Page Settings ──────────────────────────────────────────────────────
    PageSetting:
      type: object
      properties:
        id: { type: integer }
        page_key: { type: string }
        ready: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PageSettingListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/PageSetting' }
    PageSettingResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/PageSetting' }
    UpdatePageSettingRequest:
      type: object
      required: [ready]
      properties:
        ready: { type: boolean }

    # ─── Companies ──────────────────────────────────────────────────────────
    Company:
      type: object
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Company' }
    CompanyResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/Company' }
    CreateCompanyRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 2, maxLength: 50, description: "Otomatis di-uppercase" }
        name: { type: string, minLength: 2, maxLength: 255 }
    UpdateCompanyRequest:
      type: object
      properties:
        code: { type: string, minLength: 2, maxLength: 50 }
        name: { type: string, minLength: 2, maxLength: 255 }
    CompanyBranch:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        name: { type: string }
        code: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CompanyBranchListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/CompanyBranch' }
    CompanyBranchResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/CompanyBranch' }
    CreateCompanyBranchRequest:
      type: object
      required: [name, code, is_active]
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        code: { type: string, minLength: 2, maxLength: 50, description: "Otomatis di-uppercase" }
        is_active: { type: boolean }
    UpdateCompanyBranchRequest:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 100 }
        code: { type: string, minLength: 2, maxLength: 50 }
        is_active: { type: boolean }

    # ─── Roles & Permissions ────────────────────────────────────────────────
    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        category: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    PermissionRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/PermissionRef' }
          description: "Hanya ada di GET /roles (list) — GET /roles/:id (single) tidak menyertakan field ini"
    RoleListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Role' }
    RoleResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/Role' }
    CreateRoleRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 2, maxLength: 100, description: "Otomatis di-lowercase" }
        description: { type: string, maxLength: 500 }
    UpdateRoleRequest:
      type: object
      properties:
        description: { type: string, maxLength: 500 }
      description: >
        Hanya `description` — `name` immutable lewat endpoint ini. Kalau role
        `is_system=true`, service tetap hanya izinkan update description
        (tidak divalidasi Zod, dicek di service layer).
    UpdateRolePermissionsRequest:
      type: object
      required: [permission_ids]
      properties:
        permission_ids:
          type: array
          items: { type: integer, minimum: 1 }
          minItems: 1
    PermissionListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
    PermissionResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/Permission' }
    CreatePermissionRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 3, maxLength: 100, pattern: '^[a-z0-9.:_-]+$', example: "metrics:view" }
        description: { type: string }
        category: { type: string, minLength: 1, maxLength: 50 }
    UpdatePermissionRequest:
      type: object
      properties:
        description: { type: string }
        category: { type: string, minLength: 1, maxLength: 50 }

    # ─── Config ─────────────────────────────────────────────────────────────
    BusinessConfig:
      type: object
      properties:
        key: { type: string }
        value: { type: string }
        description: { type: string, nullable: true }
    BusinessConfigListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/BusinessConfig' }
    BusinessConfigResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/BusinessConfig' }
    UpdateBusinessConfigRequest:
      type: object
      required: [value]
      properties:
        value: { type: string, minLength: 1 }
    AccurateCredential:
      type: object
      description: >
        PERHATIAN: `api_token` dan `signature_secret` dikembalikan dalam
        bentuk PLAINTEXT (di-decrypt server-side) — ini perilaku production
        yang sudah ada, bukan sesuatu yang diperbaiki di dokumentasi ini,
        dicatat di sini supaya konsumen API sadar dan tidak sembarangan
        log/expose response ini.
      properties:
        id: { type: integer }
        branch_id: { type: integer }
        auth_method: { type: string, enum: [api_token, oauth] }
        api_token: { type: string, nullable: true, description: "PLAINTEXT — lihat catatan di atas" }
        app_key: { type: string, nullable: true }
        signature_secret: { type: string, nullable: true, description: "PLAINTEXT — lihat catatan di atas" }
        subdomain: { type: string }
        company_db_id: { type: string, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AccurateCredentialResponse:
      type: object
      properties:
        message: { type: string }
        data:
          oneOf:
            - { $ref: '#/components/schemas/AccurateCredential' }
            - { type: "null" }
    SaveAccurateCredentialsRequest:
      type: object
      required: [branch_id, subdomain]
      properties:
        branch_id: { type: integer }
        auth_method: { type: string, enum: [api_token, oauth], default: api_token }
        api_token: { type: string }
        signature_secret: { type: string }
        app_key: { type: string }
        signature_secret_oauth: { type: string }
        client_id: { type: string }
        client_secret: { type: string }
        callback_url: { type: string, format: uri }
        subdomain: { type: string }
        company_db_id: { type: string }
    AccurateTestConnectionRequest:
      type: object
      required: [subdomain, api_token, signature_secret]
      properties:
        subdomain: { type: string }
        api_token: { type: string }
        signature_secret: { type: string }
    AccurateTestResult:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            success: { type: boolean }
            host: { type: string }
            alias: { type: string }
            db_id: { type: string }
            user_name: { type: string }
            message: { type: string }

    # ─── Audit Log ──────────────────────────────────────────────────────────
    AuditLog:
      type: object
      properties:
        id: { type: integer }
        actor:
          oneOf:
            - type: object
              properties:
                id: { type: integer }
                name: { type: string }
            - { type: "null" }
        action: { type: string, example: "high_margin.create" }
        entity: { type: string }
        entity_id: { type: string }
        entity_key: { type: string }
        company_id: { type: integer, nullable: true }
        old_value: { type: object, nullable: true, additionalProperties: true }
        new_value: { type: object, nullable: true, additionalProperties: true }
        meta: { type: object, nullable: true, additionalProperties: true }
        ip_address: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AuditLogListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/AuditLog' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    AuditLogResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/AuditLog' }
    AuditActionsResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { type: string }
          example: ["channel_division.create", "high_margin.update", "user.create"]

    # ─── Customers ──────────────────────────────────────────────────────────
    CustomerRow:
      type: object
      properties:
        id: { type: integer }
        customer_code: { type: string, nullable: true }
        name: { type: string }
        company: { $ref: '#/components/schemas/CompanyRef' }
        business_unit: { type: string, nullable: true }
        division: { type: string, nullable: true }
        status: { type: string, enum: [new, active, dormant, existing] }
        first_invoice_date: { type: string, format: date, nullable: true }
        last_invoice_date: { type: string, format: date, nullable: true }
        category_count: { type: integer }
        avg_monthly_revenue: { type: number }
        lifetime_value: { type: number }
        total_invoices: { type: integer }
    CustomerListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/CustomerRow' }
        meta: { $ref: '#/components/schemas/PaginationMeta' }
    CustomerDetail:
      type: object
      properties:
        id: { type: integer }
        customer_code: { type: string, nullable: true }
        name: { type: string }
        company: { $ref: '#/components/schemas/CompanyRef' }
        business_unit: { type: string, nullable: true }
        division: { type: string, nullable: true }
        channel: { type: string, nullable: true }
        status: { type: string, enum: [new, active, dormant, existing] }
        first_invoice_date: { type: string, format: date, nullable: true }
        last_invoice_date: { type: string, format: date, nullable: true }
        lifetime_value: { type: number }
        avg_monthly_revenue: { type: number }
        category_count: { type: integer }
        categories_bought:
          type: array
          items: { type: string }
        monthly_revenue_trend:
          type: array
          items:
            type: object
            properties:
              month: { type: string }
              revenue: { type: number }
              gp: { type: number }
        recent_invoices:
          type: array
          items:
            type: object
            properties:
              invoice_number: { type: string }
              invoice_date: { type: string, format: date }
              total_revenue: { type: number }
              total_gp: { type: number }
    CustomerDetailResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/CustomerDetail' }

    # ─── Products (settings/local + Accurate proxy) ────────────────────────
    LocalProduct:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        product_name: { type: string }
        product_category_id: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    LocalProductListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/LocalProduct' }
    ProductCategory:
      type: object
      properties:
        id: { type: integer }
        company_id: { type: integer }
        name: { type: string }
        item_type: { type: string, enum: [unit, consumable, sparepart, service] }
        avg_margin_percent: { type: number }
        is_service: { type: boolean, deprecated: true, description: "Deprecated — pakai item_type" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductCategoryListResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: array
          items: { $ref: '#/components/schemas/ProductCategory' }
    AccurateCategoriesResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            categories:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  name: { type: string }
                  isService: { type: boolean }
            branch_id: { type: integer }
            branch_name: { type: string }
            company_name: { type: string }
    AccurateProductsResponse:
      type: object
      properties:
        message: { type: string }
        data:
          type: object
          properties:
            items:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  no: { type: string }
                  name: { type: string }
                  unitPrice: { type: number }
                  itemCategoryId: { type: integer, nullable: true }
                  itemCategoryName: { type: string, nullable: true }
                  itemType: { type: string }
                  unit1Name: { type: string, nullable: true }
                  upcNo: { type: string, nullable: true }
                  notes: { type: string, nullable: true }
                  minimumQuantity: { type: number }
                  usePpn: { type: boolean }
                  controlQuantity: { type: boolean }
                  manageSN: { type: boolean }
            total: { type: integer }
            page: { type: integer }
            per_page: { type: integer }
            branch_id: { type: integer }
            branch_name: { type: string }
            company_name: { type: string }

    # ─── Import ─────────────────────────────────────────────────────────────
    ImportResult:
      type: object
      properties:
        import_log_id: { type: integer }
        status: { type: string, enum: [success, partial, failed] }
        total_invoices: { type: integer }
        success_invoices: { type: integer }
        error_rows: { type: integer }
        error_summary: { type: string, nullable: true }
    ImportResultResponse:
      type: object
      properties:
        message: { type: string }
        data: { $ref: '#/components/schemas/ImportResult' }
    ImportLog:
      type: object
