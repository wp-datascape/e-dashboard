  # ─── Import ──────────────────────────────────────────────────────────────
  /import/template:
    get:
      tags: [Import]
      summary: Download template Excel faktur penjualan
      description: Response biner (.xlsx), bukan JSON envelope.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: File .xlsx
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema: { type: string, format: binary }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /import/csv:
    post:
      tags: [Import]
      summary: Upload & proses file faktur (CSV/XLSX)
      security: [{ cookieAuth: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, company_id, period_month]
              properties:
                file: { type: string, format: binary, description: ".csv atau .xlsx, max 10MB" }
                company_id: { type: string, description: "Dikirim sebagai form field, di-parse jadi integer" }
                period_month: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: OK (cek field status di body — bisa 'partial' meski HTTP 200)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportResultResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '413':
          description: File terlalu besar (>10MB)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Error saat memproses isi file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /import/csv/stream:
    post:
      tags: [Import]
      summary: Upload & proses file faktur dengan progress streaming (SSE)
      description: >
        Field form sama persis dengan POST /import/csv. Response BUKAN JSON
        biasa — Content-Type text/event-stream, kirim event berulang:
        `{event:'progress', processed, total, success, errors}` selama proses
        berjalan, lalu sekali `{event:'done', result: <ImportResult>}` di
        akhir, atau `{event:'error', message}` kalau gagal. Swagger UI "Try it
        out" akan menampilkan raw stream, bukan format SSE yang di-parse.
      security: [{ cookieAuth: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, company_id, period_month]
              properties:
                file: { type: string, format: binary }
                company_id: { type: string }
                period_month: { type: string, pattern: '^\d{4}-\d{2}$' }
      responses:
        '200':
          description: text/event-stream — lihat deskripsi di atas untuk bentuk tiap event
          content:
            text/event-stream:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /import/logs:
    get:
      tags: [Import]
      summary: List riwayat import
      security: [{ cookieAuth: [] }]
      parameters:
        - name: company_id
          in: query
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ImportLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /import/logs/{id}:
    get:
