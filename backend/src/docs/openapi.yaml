      tags: [Products]
      summary: "[Proxy live] Kategori produk langsung dari Accurate Online"
      description: >
        Live call ke Accurate API (HMAC auth) tiap request — bukan dari DB lokal.
        Bisa lambat/gagal kalau Accurate down. Dipakai saat setup mapping
        kategori awal, bukan operasional harian.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccurateCategoriesResponse' }
        '400':
          description: Kredensial branch belum lengkap/tidak valid
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Belum ada kredensial Accurate aktif untuk branch ini
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Accurate API tidak bisa dihubungi/error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /products/accurate:
    get:
      tags: [Products]
      summary: "[Proxy live] Cari produk langsung dari Accurate Online"
      description: Live call ke Accurate API tiap request, sama seperti /products/accurate/categories.
      security: [{ cookieAuth: [] }]
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: { type: integer, minimum: 1 }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
