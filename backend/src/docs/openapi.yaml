          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditLogListResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit-logs/actions:
    get:
      tags: [Audit Log]
      summary: Distinct action yang pernah tercatat
      description: Dipakai untuk isi opsi dropdown filter Action di halaman Audit Log — bukan daftar statis.
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditActionsResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /audit-logs/{id}:
    get:
      tags: [Audit Log]
