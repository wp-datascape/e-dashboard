  /customers:
    get:
      tags: [Customers]
      summary: List customers (Customer Workbench)
      security: [{ cookieAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/CompanyIdParam'
        - name: search
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [new, active, dormant, existing] }
