  /config/accurate/credentials/{branchId}:
    get:
      tags: [Config]
      summary: Ambil kredensial Accurate sebuah branch
      description: >
        PERHATIAN: response menyertakan api_token & signature_secret dalam
        bentuk plaintext (lihat deskripsi schema AccurateCredential).
      security: [{ cookieAuth: [] }]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK (null kalau belum ada kredensial tersimpan)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccurateCredentialResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Config]
      summary: Simpan/update kredensial Accurate sebuah branch
      description: "Permission: config.integration:create ATAU config.integration:update (cukup salah satu)."
      security: [{ cookieAuth: [], csrfHeader: [] }]
      parameters:
        - name: branchId
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaveAccurateCredentialsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccurateCredentialResponse' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /config/accurate/test-connection:
    post:
      tags: [Config]
      summary: Test koneksi Accurate dengan kredensial yang diberikan
      description: Live call ke Accurate Online API — tidak menyimpan apa pun, murni test.
      security: [{ cookieAuth: [], csrfHeader: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AccurateTestConnectionRequest' }
      responses:
        '200':
          description: OK (cek field success di body untuk hasil sebenarnya)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccurateTestResult' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '502':
          description: Accurate API tidak bisa dihubungi
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ─── Audit Log ───────────────────────────────────────────────────────────
  /audit-logs:
