version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: e-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dashboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dashboard123}
      POSTGRES_DB: ${POSTGRES_DB:-e_dashboard}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-dashboard}']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
