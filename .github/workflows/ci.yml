name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Env di level job (bukan per-step) - berlaku otomatis ke SEMUA step di job ini,
    # supaya tidak ada step yang lupa dikasih (kejadian nyata: step Seed sempat lupa
    # ditambah JWT_SECRET/CSRF_SECRET/CREDENTIALS_ENCRYPTION_KEY, migrate/seed.ts
    # ternyata import config/env.ts yang mewajibkan semuanya, bukan cuma DATABASE_URL).
    env:
      DATABASE_URL: postgresql://dashboard:dashboard123@localhost:5432/e_dashboard
      JWT_SECRET: ci-test-jwt-secret-minimal-32-karakter!!
      CSRF_SECRET: ci-test-csrf-secret-minimal-32-karakter!
      CREDENTIALS_ENCRYPTION_KEY: ci-test-encryption-key-32-karakter!!

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: dashboard
          POSTGRES_PASSWORD: dashboard123
          POSTGRES_DB: e_dashboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependency
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Migrate database
        run: bun run db:migrate

      - name: Seed database
        run: bun run db:seed

      - name: Test
        run: bun test

      - name: Build
        run: bun run build

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout kode
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependency
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Dependency audit
        run: bun audit --audit-level=high

      - name: Build (sudah termasuk typecheck)
        run: bun run build
