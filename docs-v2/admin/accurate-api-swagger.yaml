openapi: "3.1.0"
info:
  title: Accurate Online API
  description: |
    Dokumentasi OpenAPI untuk Accurate Online API — mencakup API Dasar (Nucleus) dan API Accurate (modul-modul bisnis).

    ## Base URL

    | API | Base URL |
    |-----|----------|
    | API Dasar (Nucleus) | `https://account.accurate.id` |
    | API Accurate | `https://{subdomain}.accurate.id/accurate` |

    Ganti `{subdomain}` dengan subdomain perusahaan Anda (contoh: `xyz.accurate.id`).

    ## Otorisasi

    API ini menggunakan OAuth 2.0. Setiap endpoint memiliki scope tertentu (contoh: `customer_view`, `customer_save`).
    Session ID didapat dari response saat memanggil API `/api/open-db.do`.

    ## Konvensi Parameter

    - Parameter dikirim sebagai query string (GET) atau request body (POST)
    - Parameter tipe object (complex) dikirim sebagai nested parameter dengan prefix `data[n].field`
    - Untuk bulk-save, gunakan index array: `data[0].field`, `data[1].field`, dst.
    - Pagination menggunakan parameter `sp` (SortPaging)

    ## Referensi

    - Dokumentasi resmi: https://account.accurate.id/developer/api-docs.do
    - Format CSV/Excel: `docs-v2/admin/accurate-format.md`
    - Strategi integrasi: `docs-v2/admin/integration-strategy.md`
  version: "1.0.0"
  contact:
    name: Accurate Online
    url: https://account.accurate.id
servers:
  - url: https://account.accurate.id
    description: API Dasar (Nucleus)
  - url: https://{subdomain}.accurate.id/accurate
    description: API Accurate
    variables:
      subdomain:
        default: xyz
        description: Subdomain perusahaan di Accurate Online
paths:
  # ============================================================
  # API DASAR (NUCLEUS)
  # ============================================================
  /api:
    get:
      summary: API Dasar (Nucleus)
      description: Endpoint utama untuk manajemen database, session, webhook, dan user info.
      parameters:
        - name: action
          in: query
          required: true
          description: Action yang akan dijalankan
          schema:
            type: string
            enum:
              - approved-scope
              - auth-info
              - db-check-session
              - db-detail
              - db-list
              - db-refresh-session
              - db-status
              - open-db
              - userinfo
              - webhook-history
              - webhook-renew
      responses:
        "200":
          description: Berhasil
          content:
            application/json:
              schema:
                type: object
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2: []

  # ============================================================
  # MASTER DATA — CUSTOMER
  # ============================================================
  /api/customer/list.do:
    get:
      summary: Daftar Pelanggan
      description: Melihat daftar data Pelanggan dengan filter yang sesuai
      tags:
        - Master Data - Customer
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/filter"
        - $ref: "#/components/parameters/keywords"
        - $ref: "#/components/parameters/lastUpdateFilter"
        - name: npwpNo
          in: query
          schema:
            type: string
          description: Filter nomor NPWP
        - $ref: "#/components/parameters/sp"
        - name: suspendedFilter
          in: query
          schema:
            type: boolean
          description: Filter status non aktif
        - name: wpNumber
          in: query
          schema:
            type: string
          description: Filter nomor wajib pajak
      responses:
        "200":
          description: Daftar pelanggan berhasil didapatkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    $ref: "#/components/schemas/ApiListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2:
            - customer_view

  /api/customer/detail.do:
    get:
      summary: Detail Pelanggan
      description: Melihat detil data Pelanggan berdasarkan id atau customerNo
      tags:
        - Master Data - Customer
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/fields"
        - name: id
          in: query
          schema:
            type: integer
          description: ID pelanggan
        - name: customerNo
          in: query
          schema:
            type: string
          description: Nomor identitas pelanggan
      responses:
        "200":
          description: Detail pelanggan berhasil didapatkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    $ref: "#/components/schemas/Customer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - OAuth2:
            - customer_view

  /api/customer/save.do:
    post:
      summary: Simpan Pelanggan
      description: Membuat data Pelanggan baru atau mengedit yang sudah ada. Untuk edit, sertakan parameter `id`.
      tags:
        - Master Data - Customer
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: "#/components/schemas/CustomerSaveParams"
      responses:
        "200":
          description: Pelanggan berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    type: object
                    properties:
                      id:
                        type: integer
                        description: ID pelanggan yang baru dibuat/diupdate
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2:
            - customer_save

  /api/customer/bulk-save.do:
    post:
      summary: Simpan Pelanggan Massal
      description: Membuat/mengedit beberapa data Pelanggan sekaligus (max 100)
      tags:
        - Master Data - Customer
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                data:
                  type: array
                  items:
                    $ref: "#/components/schemas/CustomerSaveParams"
                  maxItems: 100
      responses:
        "200":
          description: Data massal berhasil disimpan
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2:
            - customer_save

  /api/customer/delete.do:
    delete:
      summary: Hapus Pelanggan
      description: Menghapus data Pelanggan berdasarkan id atau customerNo
      tags:
        - Master Data - Customer
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - name: id
          in: query
          schema:
            type: integer
          description: ID pelanggan
        - name: customerNo
          in: query
          schema:
            type: string
          description: Nomor identitas pelanggan
      responses:
        "200":
          description: Pelanggan berhasil dihapus
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - OAuth2:
            - customer_delete

