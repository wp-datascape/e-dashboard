components:
  parameters:
    sessionId:
      name: X-Session-ID
      in: header
      schema:
        type: string
      description: Session ID (OAuth) — didapat dari response `/api/open-db.do`
      required: false
    fields:
      name: fields
      in: query
      schema:
        type: string
      description: Field yang ingin ditampilkan (dipisah koma). Contoh: `id,name,no`
      required: false
    filter:
      name: filter
      in: query
      schema:
        type: string
      description: Filter lanjutan (format JSON). Contoh: `{"name":{"op":"CONTAIN","val":["ABC"]}}`
      required: false
    keywords:
      name: keywords
      in: query
      schema:
        type: string
      description: Kata kunci pencarian
      required: false
    lastUpdateFilter:
      name: lastUpdateFilter
      in: query
      schema:
        type: string
      description: Filter waktu perubahan data
      required: false
    sp:
      name: sp
      in: query
      schema:
        type: string
      description: "SortPaging: format JSON. Contoh: {\"page\":1,\"pageSize\":20,\"sort\":\"name|asc\"}"
      required: false

  schemas:
    # ============================================================
    # RESPONSE SCHEMAS
    # ============================================================
    ApiListResponse:
      type: object
      properties:
        page:
          type: integer
          description: Halaman saat ini (1-based)
        pageSize:
          type: integer
          description: Jumlah data per halaman
        total:
          type: integer
          description: Total data
        data:
          type: array
          description: Array data
          items:
            type: object
        sort:
          type: string
          description: Urutan data
        hasNextPage:
          type: boolean
          description: Apakah ada halaman berikutnya

    # ============================================================
    # FILTER SCHEMAS
    # ============================================================
    ApiFilter:
      type: object
      description: Filter lanjutan untuk list endpoints
      properties:
        op:
          type: string
          enum:
            - EQUAL
            - NOT_EQUAL
            - GREATER_THAN
            - GREATER_EQUAL_THAN
            - LESS_THAN
            - LESS_EQUAL_THAN
            - BETWEEN
            - NOT_BETWEEN
            - CONTAIN
            - EMPTY
            - NOT_EMPTY
          description: Operator filter
          default: EQUAL
        val:
          type: array
          description: Nilai filter (1 atau 2 nilai tergantung operator)
          items:
            type: string

    SortPaging:
      type: object
      description: Parameter pagination dan sorting
      properties:
        page:
          type: integer
          description: Halaman data, mulai dari 1
          default: 1
        pageSize:
          type: integer
          description: Jumlah data per halaman
          default: 20
        sort:
          type: string
          description: "Format: `field:asc` atau `field:desc`. Multi: `name|asc;no|desc`"

    LongFilter:
      type: object
      properties:
        op:
          type: string
          enum: [EQUAL, NOT_EQUAL, BETWEEN, EMPTY, NOT_EMPTY]
        val:
          type: array
          items:
            type: integer

    DateFilter:
      type: object
      properties:
        op:
          type: string
          enum: [EQUAL, GREATER_THAN, GREATER_EQUAL_THAN, LESS_THAN, LESS_EQUAL_THAN, BETWEEN, EMPTY, NOT_EMPTY]
        val:
          type: array
          items:
            type: string
            format: date

    TimestampFilter:
      type: object
      properties:
        op:
          type: string
          enum: [EQUAL, GREATER_THAN, GREATER_EQUAL_THAN, LESS_THAN, LESS_EQUAL_THAN, BETWEEN]
        val:
          type: array
          items:
            type: string
            format: date-time

    ApprovalStatusFilter:
      type: object
      properties:
        op:
          type: string
          enum: [EQUAL, NOT_EQUAL]
          default: EQUAL
        val:
          type: array
          items:
            $ref: "#/components/schemas/ApprovalStatus"

    # ============================================================
    # ENTITY SCHEMAS
    # ============================================================
    Customer:
      type: object
      description: Data pelanggan
      properties:
        id:
          type: integer
          description: ID otomatis dari sistem
        customerNo:
          type: string
          description: Nomor identitas pelanggan
        name:
          type: string
          description: Nama pelanggan
        billStreet:
          type: string
          description: Alamat penagihan (jalan)
        billCity:
          type: string
          description: Kota penagihan
        billProvince:
          type: string
          description: Provinsi penagihan
        billCountry:
          type: string
          description: Negara penagihan
        billZipCode:
          type: string
          description: Kode pos penagihan
        phone:
          type: string
          description: Nomor telepon
        mobilePhone:
          type: string
          description: Nomor HP
        fax:
          type: string
          description: Nomor fax
        email:
          type: string
          format: email
          description: Alamat email
        website:
          type: string
          description: Website
        categoryName:
          type: string
          description: Nama kategori pelanggan
        termName:
          type: string
          description: Syarat pembayaran
        currencyCode:
          type: string
          description: Kode mata uang
        description:
          type: string
          description: Deskripsi
        npwpNo:
          type: string
          description: Nomor NPWP
        pkpNo:
          type: string
          description: Nomor PKP
        wpNumber:
          type: string
          description: Nomor wajib pajak
        wpName:
          type: string
          description: Nama wajib pajak
        wpType:
          type: string
          description: Tipe wajib pajak
        nitku:
          type: string
          description: NITKU
        customerTaxType:
          $ref: "#/components/schemas/CustomerTaxType"
          description: Tipe pajak pelanggan
        salesmanNumber:
          type: string
          description: Nomor penjual
        priceCategoryName:
          type: string
          description: Kategori harga penjualan

    CustomerSaveParams:
      type: object
      description: Parameter untuk save customer
      properties:
        id:
          type: integer
          description: ID pelanggan (untuk edit). Kosongkan untuk create baru.
        name:
          type: string
          description: Nama pelanggan (required)
        transDate:
          type: string
          format: date
          description: Tanggal transaksi (required)
        customerNo:
          type: string
          description: Nomor identitas pelanggan
        billStreet:
          type: string
        billCity:
          type: string
        billProvince:
          type: string
        billCountry:
          type: string
        billZipCode:
          type: string
        shipStreet:
          type: string
        shipCity:
          type: string
        shipProvince:
          type: string
        shipCountry:
          type: string
        shipZipCode:
          type: string
        phone:
          type: string
        mobilePhone:
          type: string
        fax:
          type: string
        email:
          type: string
          format: email
        website:
          type: string
        categoryName:
          type: string
          description: Nama kategori pelanggan
        termName:
          type: string
          description: Syarat pembayaran
        currencyCode:
          type: string
          description: Kode mata uang
        description:
          type: string
        npwpNo:
          type: string
          description: Nomor NPWP
        pkpNo:
          type: string
          description: Nomor PKP
        wpNumber:
          type: string
        wpName:
          type: string
        wpType:
          type: string
        nitku:
          type: string
        customerTaxType:
          $ref: "#/components/schemas/CustomerTaxType"
        salesmanNumber:
          type: string
        priceCategoryName:
          type: string
        customerLimitAge:
          type: integer
        customerLimitAgeValue:
          type: string
        customerLimitAmount:
          type: number
        customerLimitAmountValue:
          type: string
        defaultIncTax:
          type: boolean
        defaultSalesDisc:
          type: number
        discountCategoryName:
          type: string

    Item:
      type: object
      description: Data barang & jasa
      properties:
        id:
          type: integer
        no:
          type: string
          description: Nomor barang
        name:
          type: string
          description: Nama barang
        itemType:
          $ref: "#/components/schemas/ItemType"
          description: Tipe barang
        itemCategoryName:
          type: string
          description: Nama kategori barang
        unit1Name:
          type: string
          description: Satuan 1
        unit1Price:
          type: number
          description: Harga satuan 1
        unit2Name:
          type: string
          description: Satuan 2
        unit2Price:
          type: number
          description: Harga satuan 2
        upcNo:
          type: string
          description: Barcode/UPC
        weight:
          type: number
          description: Berat
        minimumQuantity:
          type: number
          description: Stok minimum
        minimumQuantityReorder:
          type: number
          description: Minimum reorder
        notes:
          type: string
          description: Catatan
        usePpn:
          type: boolean
          description: Gunakan PPN
        manageSN:
          type: boolean
          description: Kelola nomor seri
        manageExpired:
          type: boolean
          description: Kelola tanggal kadaluarsa
        serialNumberType:
          $ref: "#/components/schemas/SerialNumberType"
        controlQuantity:
          type: boolean
          description: Kontrol kuantitas
        defaultDiscount:
          type: number
          description: Diskon default (%)

    ItemSaveParams:
      type: object
      description: Parameter untuk save item
      properties:
        id:
          type: integer
          description: ID barang (untuk edit)
        name:
          type: string
          description: Nama barang (required)
        itemCategoryName:
          type: string
          description: Kategori barang (required)
        itemType:
          $ref: "#/components/schemas/ItemType"
          description: Tipe barang (required)
        unit1Name:
          type: string
          description: Satuan 1 (required)
        no:
          type: string
          description: Nomor barang
        unit1Price:
          type: number
          description: Harga satuan 1
        unit2Name:
          type: string
        unit2Price:
          type: number
        unit3Name:
          type: string
        unit3Price:
          type: number
        unit4Name:
          type: string
        unit4Price:
          type: number
        unit5Name:
          type: string
        unit5Price:
          type: number
        upcNo:
          type: string
          description: Barcode
        weight:
          type: number
        notes:
          type: string
        minimumQuantity:
          type: number
        minimumQuantityReorder:
          type: number
        controlQuantity:
          type: boolean
        usePpn:
          type: boolean
        defaultDiscount:
          type: number
        manageSN:
          type: boolean
        manageExpired:
          type: boolean
        serialNumberType:
          $ref: "#/components/schemas/SerialNumberType"
        vendorPrice:
          type: number
          description: Harga beli dari pemasok

    SalesInvoiceDetailParam:
      type: object
      description: Parameter untuk detail item dalam sales invoice
      properties:
        itemNo:
          type: string
          description: Nomor barang (required)
        unitPrice:
          type: number
          description: Harga satuan (required)
        quantity:
          type: number
          description: Kuantitas
        detailName:
          type: string
          description: Nama detail (jika berbeda dari nama barang)
        detailNotes:
          type: string
          description: Catatan detail
        itemUnitName:
          type: string
          description: Nama satuan
        itemDiscPercent:
          type: number
          description: Diskon per item (%)
        warehouseName:
          type: string
          description: Nama gudang
        salesOrderNumber:
          type: string
          description: Nomor pesanan penjualan (referensi)
        controlQuantity:
          type: boolean
          description: Kontrol kuantitas
        departmentName:
          type: string
          description: Departemen
        projectNo:
          type: string
          description: Nomor proyek
        useTax1:
          type: boolean
        useTax2:
          type: boolean
        useTax3:
          type: boolean

    # ============================================================
    # ENUM SCHEMAS
    # ============================================================
    CustomerTaxType:
      type: string
      description: Tipe Pajak Pelanggan
      enum:
        - CTAS_KEPADA_SELAIN_PEMUNGUT_PPN
        - CTAS_KEPADA_PEMUNGUT_PPN_INSTANSI_PEMERINTAH
        - CTAS_KEPADA_PEMUNGUT_PPN_SELAIN_INSTANSI_PEMERINTAH
        - CTAS_DPP_NILAI_LAIN
        - CTAS_BESARAN_TERTENTU
        - CTAS_KEPADA_ORANG_PRIBADI_PEMEGANG_PASPOR_LUAR_NEGERI
        - CTAS_PENYERAHAN_DENGAN_FASILITAS_TIDAK_DIPUNGUT
        - CTAS_PENYERAHAN_DENGAN_FASILITAS_DIBEBASKAN
        - CTAS_PENYERAHAN_AKTIVA_TIDAK_DIPERJUALBELIKAN
        - CTAS_PENYERAHAN_LAINNYA
        - CTAS_EKSPOR_BARANG_BERWUJUD
        - CTAS_EKSPOR_BARANG_TIDAK_BERWUJUD
        - CTAS_EKSPOR_JASA

    VendorTaxType:
      type: string
      description: Tipe Pajak Pemasok
      enum:
        - CTAS_KEPADA_SELAIN_PEMUNGUT_PPN
        - CTAS_KEPADA_PEMUNGUT_PPN_INSTANSI_PEMERINTAH
        - CTAS_KEPADA_PEMUNGUT_PPN_SELAIN_INSTANSI_PEMERINTAH
        - CTAS_DPP_NILAI_LAIN
        - CTAS_BESARAN_TERTENTU
        - CTAS_KEPADA_ORANG_PRIBADI_PEMEGANG_PASPOR_LUAR_NEGERI
        - CTAS_PENYERAHAN_DENGAN_FASILITAS_TIDAK_DIPUNGUT
        - CTAS_PENYERAHAN_DENGAN_FASILITAS_DIBEBASKAN
        - CTAS_PENYERAHAN_AKTIVA_TIDAK_DIPERJUALBELIKAN
        - CTAS_PENYERAHAN_LAINNYA
        - CTAS_IMPOR_BARANG_KENA_PAJAK
        - CTAS_PEMANFAATAN_BARANG_TIDAK_BERWUJUD_DAN_JASA_KENA_PAJAK

    ItemType:
      type: string
      description: Jenis barang
      enum:
        - INVENTORY
        - NON_INVENTORY
        - SERVICE
        - GROUP
        - PRODUCTION_COST

    ItemAdjustmentType:
      type: string
      description: Tipe penyesuaian persediaan
      enum:
        - ADJUSTMENT_IN
        - ADJUSTMENT_OUT
        - ADJUSTMENT_STOCK

    ItemTransferType:
      type: string
      description: Tipe pemindahan barang
      enum:
        - TRANSFER_OUT
