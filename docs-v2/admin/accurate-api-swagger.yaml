    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Kode error
              message:
                type: string
                description: Pesan error
    Unauthorized:
      description: Token tidak valid atau tidak ada
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: UNAUTHORIZED
              message:
                type: string
                example: Token OAuth tidak valid
    NotFound:
      description: Resource tidak ditemukan
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: NOT_FOUND
              message:
                type: string
                example: Data tidak ditemukan

