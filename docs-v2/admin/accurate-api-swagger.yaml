      tags:
        - Transaksi Penjualan - Sales Invoice
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/fields"
        - $ref: "#/components/parameters/sp"
        - name: approvalStatus
          in: query
          schema:
            $ref: "#/components/schemas/ApprovalStatusFilter"
          description: Status persetujuan
        - name: branchId
          in: query
          schema:
            $ref: "#/components/schemas/LongFilter"
          description: Cabang
        - name: branchName
          in: query
          schema:
            type: string
          description: Nama cabang
        - name: customerId
          in: query
          schema:
            $ref: "#/components/schemas/LongFilter"
          description: Pelanggan
        - name: customerNo
          in: query
          schema:
            type: string
          description: Nomor identitas pelanggan
        - name: transDate
          in: query
          schema:
            $ref: "#/components/schemas/DateFilter"
          description: Tanggal transaksi
        - name: dueDate
          in: query
          schema:
            $ref: "#/components/schemas/DateFilter"
          description: Tanggal jatuh tempo
        - name: outstanding
          in: query
          schema:
            type: boolean
          description: Status lunas
        - name: overdue
          in: query
          schema:
            type: boolean
          description: Status jatuh tempo
        - name: keywords
          in: query
          schema:
            type: string
          description: Kata kunci
        - name: lastUpdate
          in: query
          schema:
            $ref: "#/components/schemas/TimestampFilter"
          description: Waktu perubahan
      responses:
        "200":
          description: Daftar faktur penjualan berhasil didapatkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  d:
                    $ref: "#/components/schemas/ApiListResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2:
            - sales_invoice_view

  /api/sales-invoice/detail.do:
    get:
      summary: Detail Faktur Penjualan
      tags:
        - Transaksi Penjualan - Sales Invoice
      parameters:
        - $ref: "#/components/parameters/sessionId"
        - $ref: "#/components/parameters/fields"
        - name: id
          in: query
          schema:
            type: integer
          description: ID faktur penjualan
      responses:
        "200":
          description: Detail faktur penjualan berhasil didapatkan
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
        - OAuth2:
            - sales_invoice_view

  /api/sales-invoice/save.do:
    post:
      summary: Simpan Faktur Penjualan
      tags:
        - Transaksi Penjualan - Sales Invoice
      parameters:
        - $ref: "#/components/parameters/sessionId"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: ID faktur (untuk edit)
                customerNo:
                  type: string
                  description: Nomor identitas pelanggan (required)
                transDate:
                  type: string
                  format: date
                  description: Tanggal transaksi
                number:
                  type: string
                  description: Nomor faktur
                description:
                  type: string
                  description: Deskripsi
                branchId:
                  type: integer
                  description: ID cabang
                branchName:
                  type: string
                  description: Nama cabang
                currencyCode:
                  type: string
                  description: Kode mata uang
                paymentTermName:
                  type: string
                  description: Syarat pembayaran
                detailItem:
                  type: array
                  description: Detail item barang
                  items:
                    $ref: "#/components/schemas/SalesInvoiceDetailParam"
                detailExpense:
                  type: array
                  description: Detail biaya
                  items:
                    type: object
                detailDownPayment:
                  type: array
                  description: Detail uang muka
                  items:
                    type: object
      responses:
        "200":
          description: Faktur penjualan berhasil disimpan
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
        - OAuth2:
            - sales_invoice_save

